apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
replicas:
  - name: web
    count: 3
  - name: api
    count: 3
configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=production
patches:
  # On EKS the AWS load balancer is the only way in, so the Ingress
  # answers on any address instead of one host name.
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: remove
        path: /spec/rules/0/host
        