apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
replicas:
  - name: web
    count: 3
  - name: api
    count: 3
configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=production
patches:
  # Staging and production share one NLB, so each Ingress needs its own host.
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.__DOMAIN__