apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
replicas:
  - name: web
    count: 1
  - name: api
    count: 1
configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=staging
patches:
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.__DOMAIN__
        